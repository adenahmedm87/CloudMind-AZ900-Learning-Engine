name: Browser smoke tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cloudmind-http.log 2>&1 &
          echo $! > /tmp/cloudmind-http.pid
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cloudmind-http.log
          exit 1
      - name: Run browser smoke tests
        run: npx playwright test tests/browser-smoke.spec.js --workers=1 --reporter=line
